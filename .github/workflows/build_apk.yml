name: Build & Deploy

# Запускается при каждом push в main и вручную
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # нужно для деплоя на GitHub Pages

# Новая сборка отменяет незаконченную старую — иначе обе пушат в gh-pages и одна падает.
concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Android APK ─────────────────────────────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Android structure
        run: |
          flutter create \
            --project-name dostyq_taxi \
            --org kz.dostyq \
            --platforms android \
            .

      - name: Fix app ID
        run: |
          sed -i 's/applicationId = "kz.dostyq.dostyq_taxi"/applicationId = "kz.dostyq.taxi"/' android/app/build.gradle
          sed -i 's/namespace "kz.dostyq.dostyq_taxi"/namespace "kz.dostyq.taxi"/' android/app/build.gradle
          sed -i 's/kz.dostyq.dostyq_taxi/kz.dostyq.taxi/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="ALAKOL TAXI"/' android/app/src/main/AndroidManifest.xml

      - name: App icon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            rsvg-convert -w ${d#*:} -h ${d#*:} assets/icon/icon.svg -o android/app/src/main/res/mipmap-${d%%:*}/ic_launcher.png
          done

      - name: Fix Kotlin package
        run: |
          mkdir -p android/app/src/main/kotlin/kz/dostyq/taxi
          ORIG="android/app/src/main/kotlin/kz/dostyq/dostyq_taxi/MainActivity.kt"
          DEST="android/app/src/main/kotlin/kz/dostyq/taxi/MainActivity.kt"
          if [ -f "$ORIG" ]; then
            sed 's/package kz.dostyq.dostyq_taxi/package kz.dostyq.taxi/' "$ORIG" > "$DEST"
            rm -rf android/app/src/main/kotlin/kz/dostyq/dostyq_taxi
          fi

      - name: Add Firebase google-services
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES" > android/app/google-services.json
          sed -i 's/id "dev.flutter.flutter-plugin-loader" version "1.0.0"/&\n    id "com.google.gms.google-services" version "4.4.2" apply false/' android/settings.gradle
          sed -i 's/id "dev.flutter.flutter-gradle-plugin"/&\n    id "com.google.gms.google-services"/' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle
          grep -q 'minSdk = 23' android/app/build.gradle || { echo "minSdk patch failed"; cat android/app/build.gradle; exit 1; }
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml || { echo "manifest patch failed"; exit 1; }
          grep -q 'com.google.gms.google-services' android/settings.gradle || { echo "settings.gradle patch failed"; cat android/settings.gradle; exit 1; }
          grep -q 'com.google.gms.google-services' android/app/build.gradle || { echo "app/build.gradle patch failed"; cat android/app/build.gradle; exit 1; }

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dostyq-taxi-apk-v${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ── 2. Веб-версия → GitHub Pages (открывается на iPhone в Safari) ──
  build-web:
    name: Build Web & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create web structure
        run: |
          flutter create \
            --project-name dostyq_taxi \
            --org kz.dostyq \
            --platforms web \
            .

      - name: App icon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 32 -h 32 assets/icon/icon.svg -o web/favicon.png
          for s in 192 512; do
            rsvg-convert -w $s -h $s assets/icon/icon.svg -o web/icons/Icon-$s.png
            rsvg-convert -w $s -h $s assets/icon/icon.svg -o web/icons/Icon-maskable-$s.png
          done
          rsvg-convert -w 180 -h 180 assets/icon/icon.svg -o web/apple-touch-icon.png
          sed -i 's|<link rel="apple-touch-icon" href="[^"]*">|<link rel="apple-touch-icon" href="apple-touch-icon.png">|' web/index.html
          sed -i 's|"theme_color": "[^"]*"|"theme_color": "#FFD12E"|; s|"background_color": "[^"]*"|"background_color": "#FFD12E"|' web/manifest.json

      - name: Brand name in browser tab and home screen
        run: |
          sed -i 's|<title>.*</title>|<title>ALAKOL TAXI</title>|; s|apple-mobile-web-app-title" content="[^"]*"|apple-mobile-web-app-title" content="ALAKOL TAXI"|' web/index.html
          sed -i 's/"name": "[^"]*"/"name": "ALAKOL TAXI"/; s/"short_name": "[^"]*"/"short_name": "ALAKOL TAXI"/' web/manifest.json
          grep -q 'ALAKOL TAXI' web/index.html || { echo 'title patch failed'; cat web/index.html; exit 1; }
          # iPhone Safari при открытии клавиатуры сам прокручивает страницу вверх, а Flutter ещё и
          # поднимает поле — двойной сдвиг, верх уезжает за экран. Возвращаем прокрутку страницы в 0.
          sed -i 's#</body>#<script>(function(){var v=window.visualViewport;if(!v)return;function f(){if(window.scrollY!==0){window.scrollTo(0,0);}}v.addEventListener("scroll",f);v.addEventListener("resize",f);window.addEventListener("scroll",f);})();</script></body>#' web/index.html
          grep -q 'visualViewport' web/index.html || { echo 'keyboard patch failed'; cat web/index.html; exit 1; }

      - run: flutter pub get

      - name: Build admin
        run: |
          flutter build web --release -t lib/admin/admin_main.dart --base-href /dostyq-taxi/admin/ --web-renderer canvaskit --pwa-strategy none
          mv build/web build/admin_web

      - name: Build web
        run: |
          flutter build web --release --base-href /dostyq-taxi/ --web-renderer canvaskit --pwa-strategy none
          mv build/admin_web build/web/admin
          cp -r legal build/web/legal

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          cname: ""
