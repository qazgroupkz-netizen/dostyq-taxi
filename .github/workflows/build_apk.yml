name: Build & Deploy

# Запускается при каждом push в main и вручную
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # нужно для деплоя на GitHub Pages

jobs:
  # ── 1. Android APK ─────────────────────────────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Android structure
        run: |
          flutter create \
            --project-name dostyq_taxi \
            --org kz.dostyq \
            --platforms android \
            .

      - name: Fix app ID
        run: |
          sed -i 's/applicationId = "kz.dostyq.dostyq_taxi"/applicationId = "kz.dostyq.taxi"/' android/app/build.gradle
          sed -i 's/namespace "kz.dostyq.dostyq_taxi"/namespace "kz.dostyq.taxi"/' android/app/build.gradle
          sed -i 's/kz.dostyq.dostyq_taxi/kz.dostyq.taxi/g' android/app/src/main/AndroidManifest.xml

      - name: Fix Kotlin package
        run: |
          mkdir -p android/app/src/main/kotlin/kz/dostyq/taxi
          ORIG="android/app/src/main/kotlin/kz/dostyq/dostyq_taxi/MainActivity.kt"
          DEST="android/app/src/main/kotlin/kz/dostyq/taxi/MainActivity.kt"
          if [ -f "$ORIG" ]; then
            sed 's/package kz.dostyq.dostyq_taxi/package kz.dostyq.taxi/' "$ORIG" > "$DEST"
            rm -rf android/app/src/main/kotlin/kz/dostyq/dostyq_taxi
          fi

      - name: Add Firebase google-services
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES" > android/app/google-services.json
          sed -i 's/id "dev.flutter.flutter-plugin-loader" version "1.0.0"/&\n    id "com.google.gms.google-services" version "4.4.2" apply false/' android/settings.gradle
          sed -i 's/id "dev.flutter.flutter-gradle-plugin"/&\n    id "com.google.gms.google-services"/' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle
          grep -q 'minSdk = 23' android/app/build.gradle || { echo "minSdk patch failed"; cat android/app/build.gradle; exit 1; }
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml || { echo "manifest patch failed"; exit 1; }
          grep -q 'com.google.gms.google-services' android/settings.gradle || { echo "settings.gradle patch failed"; cat android/settings.gradle; exit 1; }
          grep -q 'com.google.gms.google-services' android/app/build.gradle || { echo "app/build.gradle patch failed"; cat android/app/build.gradle; exit 1; }

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dostyq-taxi-apk-v${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ── 2. Веб-версия → GitHub Pages (открывается на iPhone в Safari) ──
  build-web:
    name: Build Web & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create web structure
        run: |
          flutter create \
            --project-name dostyq_taxi \
            --org kz.dostyq \
            --platforms web \
            .

      - run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /dostyq-taxi/ --web-renderer html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          cname: ""
